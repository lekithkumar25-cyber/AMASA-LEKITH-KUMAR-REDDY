    <script>
      // Immediate runtime error catcher
      window.addEventListener('error', function(e) {
        console.error('Runtime script error:', e.error || e.message);
        var banner = document.getElementById('runtime-error-banner');
        if (!banner) {
          banner = document.createElement('div');
          banner.id = 'runtime-error-banner';
          banner.style.cssText = 'position:fixed;bottom:16px;left:16px;right:16px;max-width:500px;margin:0 auto;background:#fff;border:1px solid #f87171;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);padding:14px;border-radius:10px;font-family:sans-serif;font-size:13px;z-index:999999;color:#991b1b;';
          banner.innerHTML = '<strong>Portfolio Notice:</strong> <span id="runtime-error-text"></span><br/><button onclick="window.location.reload()" style="margin-top:8px;padding:4px 10px;background:#ef4444;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">Reload</button>';
          document.body.appendChild(banner);
        }
        var msg = e.error ? (e.error.message || e.error.toString()) : (e.message || 'Script load failure');
        var errSpan = document.getElementById('runtime-error-text');
        if (errSpan) errSpan.textContent = msg;
      });
    </script>
